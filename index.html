<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Despensa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --paper: #F6F1E2; --paper-raised: #FBF8EF; --ink: #26241D; --ink-soft: #6B6656;
    --pine: #24352B; --pine-tint: rgba(36,53,43,.08); --mustard: #C9962A; --mustard-tint: rgba(201,150,42,.14);
    --mustard-ink: #4A3512; --rust: #9C4A34; --line: #DAD2BA; --shadow: rgba(36,30,12,.14);
    --bg-pattern: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='140' height='140' viewBox='0 0 140 140'%3E%3Cg fill='none' stroke='%23244038' stroke-width='1.4' stroke-linecap='round' opacity='0.075'%3E%3Cpath d='M22 104 C22 84 28 68 37 56'/%3E%3Cpath d='M24 86 C15 82 11 73 13 64'/%3E%3Cpath d='M24 86 C33 82 37 73 35 64'/%3E%3Ccircle cx='104' cy='34' r='15'/%3E%3Cpath d='M104 19 L104 49 M89 34 L119 34 M93 23 L115 45 M93 45 L115 23'/%3E%3Cpath d='M60 118 C64 112 70 110 76 112'/%3E%3Ccircle cx='108' cy='108' r='1.7' fill='%23244038' stroke='none'/%3E%3Ccircle cx='118' cy='100' r='1.7' fill='%23244038' stroke='none'/%3E%3Ccircle cx='113' cy='116' r='1.7' fill='%23244038' stroke='none'/%3E%3C/g%3E%3C/svg%3E");
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1C1B16; --paper-raised: #24231C; --ink: #EDE7D6; --ink-soft: #A8A18C;
      --pine: #8FBBA0; --pine-tint: rgba(143,187,160,.14); --mustard: #E0B24C; --mustard-tint: rgba(224,178,76,.16);
      --mustard-ink: #1C1B16; --rust: #D98466; --line: #3A382C; --shadow: rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    min-height: 100vh; display: flex; justify-content: center;
    -webkit-font-smoothing: antialiased; position: relative;
  }
  body::before {
    content: ""; position: fixed; inset: 0;
    background-image: var(--bg-pattern); background-repeat: repeat; background-size: 140px 140px;
    z-index: 0; pointer-events: none;
  }
  .app { position: relative; z-index: 1; width: 100%; max-width: 480px; min-height: 100vh;
    display: flex; flex-direction: column; padding: 26px 20px 104px; }
  header.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 20px; }
  header.top .titles h1 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 2.05rem; margin: 0 0 4px; letter-spacing: -.01em; }
  header.top .titles p { margin: 0; color: var(--ink-soft); font-size: .92rem; max-width: 30ch; }
  .icon-btn { flex-shrink: 0; width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--paper-raised); color: var(--pine); font-size: 1.15rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center; }
  .icon-btn:active { transform: scale(.94); }
  .meal-tabs { display: flex; gap: 6px; background: var(--paper-raised); border: 1px solid var(--line);
    border-radius: 12px; padding: 4px; margin-bottom: 18px; }
  .meal-tabs button { flex: 1; border: none; background: transparent; color: var(--ink-soft);
    font-family: inherit; font-size: .88rem; font-weight: 500; padding: 9px 4px; border-radius: 9px; cursor: pointer; }
  .meal-tabs button.active { background: var(--pine); color: var(--paper-raised); }
  .add-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .add-row input { flex: 1; padding: 13px 14px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--paper-raised); color: var(--ink); font-size: 1rem; font-family: inherit; min-width: 0; }
  .add-row input:focus { outline: 2px solid var(--pine); outline-offset: 1px; }
  .add-row button.add { padding: 0 18px; border-radius: 10px; border: none; background: var(--pine);
    color: var(--paper-raised); font-weight: 600; font-size: 1.3rem; cursor: pointer; line-height: 1; }
  .add-row button.add:active { transform: scale(.96); }
  .scan-row { margin-bottom: 20px; }
  .scan-btn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px; border-radius: 10px; border: 1px dashed var(--line); background: transparent;
    color: var(--ink-soft); font-family: inherit; font-size: .9rem; cursor: pointer; }
  .scan-btn:active { transform: scale(.98); }
  .scan-btn:disabled { opacity: .5; cursor: default; }
  .ticket { background: var(--paper-raised); border-radius: 14px; box-shadow: 0 6px 20px var(--shadow); padding: 4px 0; margin-bottom: 22px; }
  .ticket-empty { padding: 34px 22px; text-align: center; color: var(--ink-soft); font-size: .95rem; line-height: 1.5; }
  .item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 18px;
    border-bottom: 1px dashed var(--line); }
  .item:last-child { border-bottom: none; }
  .item-name { font-family: 'IBM Plex Mono', monospace; font-size: .98rem; }
  .item button { background: none; border: none; color: var(--ink-soft); font-size: .82rem; cursor: pointer;
    padding: 6px 8px; border-radius: 6px; white-space: nowrap; }
  .item button:hover { color: var(--rust); background: rgba(156,74,52,.08); }
  .item button:disabled { opacity: .4; cursor: default; }
  .cook-btn { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); width: calc(100% - 40px);
    max-width: 440px; background: var(--pine); color: var(--paper-raised); border: none; border-radius: 14px;
    padding: 17px; font-family: 'Fraunces', serif; font-weight: 600; font-size: 1.1rem; cursor: pointer;
    box-shadow: 0 10px 26px var(--shadow); }
  .cook-btn:disabled { opacity: .55; cursor: default; }
  .cook-btn:active:not(:disabled) { transform: translateX(-50%) scale(.98); }
  .recipe, .reviewScan { background: var(--paper-raised); border-radius: 16px; box-shadow: 0 8px 24px var(--shadow);
    padding: 24px 22px 26px; margin-top: 4px; }
  .recipe .back, .reviewScan .back { background: none; border: none; color: var(--ink-soft); font-size: .88rem;
    cursor: pointer; padding: 0 0 14px; }
  .meal-tag { display: inline-block; font-size: .78rem; color: var(--mustard-ink); background: var(--mustard-tint);
    padding: 3px 10px; border-radius: 20px; margin-bottom: 10px; }
  .recipe h2, .reviewScan h2 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 1.5rem; margin: 0 0 8px; }
  .recipe .desc, .reviewScan .desc { color: var(--ink-soft); font-size: .95rem; line-height: 1.5; margin-bottom: 16px; }
  .used-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
  .used-tags span { font-family: 'IBM Plex Mono', monospace; font-size: .78rem; background: var(--pine);
    color: var(--paper-raised); padding: 4px 9px; border-radius: 20px; }
  .steps { list-style: none; margin: 0; padding: 0; counter-reset: step; }
  .steps li { counter-increment: step; display: flex; gap: 12px; padding: 12px 0; border-top: 1px dashed var(--line);
    line-height: 1.5; font-size: .97rem; }
  .steps li:first-child { border-top: none; }
  .steps li::before { content: counter(step); flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%;
    background: var(--mustard); color: var(--mustard-ink); font-family: 'IBM Plex Mono', monospace;
    font-weight: 500; font-size: .85rem; display: flex; align-items: center; justify-content: center; }
  .state-msg { text-align: center; padding: 40px 18px; color: var(--ink-soft); font-size: .95rem; }
  .spin { width: 30px; height: 30px; border: 3px solid var(--line); border-top-color: var(--pine);
    border-radius: 50%; margin: 0 auto 14px; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-box { background: rgba(156,74,52,.1); border: 1px solid var(--rust); color: var(--rust);
    border-radius: 10px; padding: 14px 16px; font-size: .9rem; margin: 0 0 16px; }
  .check-row { display: flex; align-items: center; gap: 12px; padding: 12px 2px; border-top: 1px dashed var(--line); }
  .check-row:first-of-type { border-top: none; }
  .check-row input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--pine); flex-shrink: 0; }
  .check-row label { font-family: 'IBM Plex Mono', monospace; font-size: .97rem; }
  .confirm-scan-btn { width: 100%; margin-top: 18px; padding: 14px; border-radius: 12px; border: none;
    background: var(--pine); color: var(--paper-raised); font-weight: 600; font-family: inherit; font-size: 1rem; cursor: pointer; }
  .overlay { position: fixed; inset: 0; background: rgba(20,17,8,.5); display: flex; align-items: center;
    justify-content: center; padding: 20px; z-index: 10; }
  .share-card { background: var(--paper-raised); border-radius: 18px; padding: 26px 24px 24px; max-width: 340px;
    width: 100%; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
  .share-card h2 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 1.3rem; margin: 0 0 6px; }
  .share-card p { color: var(--ink-soft); font-size: .88rem; margin: 0 0 18px; line-height: 1.5; }
  #qr-holder { display: flex; justify-content: center; margin-bottom: 18px; padding: 14px; background: #fff; border-radius: 12px; }
  .share-actions button { width: 100%; padding: 12px; border-radius: 10px; border: none; background: var(--pine);
    color: var(--paper-raised); font-family: inherit; font-weight: 600; font-size: .9rem; cursor: pointer; }
  .share-close { margin-top: 14px; background: none; border: none; color: var(--ink-soft); font-size: .85rem; cursor: pointer; }
  .status { text-align: center; color: var(--ink-soft); font-size: .8rem; margin: -8px 0 18px; }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import {
    getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  // ── CONFIGURA ESTO ─────────────────────────────────────────────
  // 1) Tu firebaseConfig (Firebase console > Configuración del
  //    proyecto > tus apps > SDK setup and config).
  const firebaseConfig = {
    apiKey: "AIzaSyAQCYC1DdphzHELsG9zsrpxHcMznR3CWo8",
    authDomain: "despensa-de-ingredientes.firebaseapp.com",
    projectId: "despensa-de-ingredientes",
    storageBucket: "despensa-de-ingredientes.firebasestorage.app",
    messagingSenderId: "795032087883",
    appId: "1:795032087883:web:e17be64409fd8aa93a4cce",
    measurementId: "G-E07PDYNKQ"
  };
  // 2) La URL de tu Worker de Cloudflare, una vez desplegado.
  const WORKER_URL = "https://TU-WORKER.tu-usuario.workers.dev";
  // ────────────────────────────────────────────────────────────────

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app, "despensa"); // el nombre debe coincidir EXACTO con tu base de datos en Firebase
  // Cada ingrediente es su propio documento: así añadir o borrar uno
  // nunca puede pisar lo que haya escrito otro familiar a la vez.
  const itemsCol = collection(db, "pantryItems");
  const itemsQuery = query(itemsCol, orderBy("addedAt", "asc"));

  const MEALS = {
    desayuno: { label: 'Desayuno', cookLabel: '¿Qué desayuno?', promptWord: 'el desayuno' },
    almuerzo: { label: 'Almuerzo', cookLabel: '¿Qué como?', promptWord: 'el almuerzo (comida del mediodía)' },
    cena:     { label: 'Cena',     cookLabel: '¿Qué ceno?',  promptWord: 'la cena' }
  };
  function guessMeal() {
    const h = new Date().getHours();
    if (h < 11) return 'desayuno';
    if (h < 18) return 'almuerzo';
    return 'cena';
  }

  const state = {
    items: [], meal: guessMeal(), view: 'list', busy: null, errorMsg: '',
    recipe: null, scanItems: [], shareOpen: false, connected: false, pendingRemovals: new Set()
  };

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function render() {
    const appEl = document.getElementById('app');
    if (state.view === 'recipe' && state.recipe) { appEl.innerHTML = renderRecipe(); wireRecipe(); return; }
    if (state.view === 'reviewScan') { appEl.innerHTML = renderReviewScan(); wireReviewScan(); return; }

    appEl.innerHTML = `
      <header class="top">
        <div class="titles"><h1>Despensa</h1><p>Lo que hay en casa, para toda la familia.</p></div>
        <button class="icon-btn" id="share-open" aria-label="Compartir">⛶</button>
      </header>
      <div class="meal-tabs">
        ${Object.entries(MEALS).map(([key, m]) => `<button data-meal="${key}" class="${state.meal===key?'active':''}">${m.label}</button>`).join('')}
      </div>
      <div class="add-row">
        <input id="new-item" type="text" placeholder="Añadir ingrediente" autocomplete="off">
        <button class="add" id="add-btn" aria-label="Añadir">+</button>
      </div>
      <div class="scan-row">
        <button class="scan-btn" id="scan-btn" ${state.busy==='scan'?'disabled':''}>📷 Foto del tique de la compra</button>
        <input type="file" id="scan-input" accept="image/*" capture="environment" style="display:none">
      </div>
      <div class="ticket">
        ${state.items.length === 0
          ? `<div class="ticket-empty">Aún no habéis añadido nada.<br>Escribid arriba lo que compréis, o haced una foto del tique.</div>`
          : state.items.map(it => `
            <div class="item" data-id="${it.id}">
              <span class="item-name">${escapeHtml(it.name)}</span>
              <button class="remove-btn" data-id="${it.id}" ${state.pendingRemovals.has(it.id)?'disabled':''}>se acabó</button>
            </div>`).join('')}
      </div>
      <p class="status">${state.connected ? 'Sincronizado con toda la familia' : 'Conectando…'}</p>
      ${state.busy === 'scan' ? `<div class="recipe state-msg" style="margin-bottom:22px;"><div class="spin"></div>Leyendo el tique…</div>` : ''}
      ${state.busy === 'recipe' ? `<div class="recipe state-msg" style="margin-bottom:22px;"><div class="spin"></div>Pensando ${MEALS[state.meal].promptWord}…</div>` : ''}
      ${state.errorMsg ? `<div class="error-box">${escapeHtml(state.errorMsg)}</div>` : ''}
      <button class="cook-btn" id="cook-btn" ${state.items.length===0 || state.busy ? 'disabled' : ''}>${MEALS[state.meal].cookLabel}</button>
      ${state.shareOpen ? renderShare() : ''}
    `;

    document.getElementById('add-btn').onclick = addItem;
    document.getElementById('new-item').addEventListener('keydown', e => { if (e.key === 'Enter') addItem(); });
    document.querySelectorAll('.remove-btn').forEach(btn => btn.onclick = () => removeItem(btn.dataset.id));
    document.querySelectorAll('.meal-tabs button').forEach(btn => btn.onclick = () => { state.meal = btn.dataset.meal; render(); });
    const cookBtn = document.getElementById('cook-btn');
    if (cookBtn) cookBtn.onclick = suggestRecipe;
    const scanBtn = document.getElementById('scan-btn');
    const scanInput = document.getElementById('scan-input');
    scanBtn.onclick = () => scanInput.click();
    scanInput.onchange = handlePhoto;
    document.getElementById('share-open').onclick = () => { state.shareOpen = true; render(); };
    if (state.shareOpen) wireShare();
  }

  function renderRecipe() {
    const r = state.recipe;
    return `
      <header class="top"><div class="titles"><h1>Despensa</h1></div></header>
      <div class="recipe">
        <button class="back" id="back-btn">&larr; volver a la despensa</button>
        <span class="meal-tag">${MEALS[state.meal].label}</span>
        <h2>${escapeHtml(r.titulo || 'Tu receta')}</h2>
        <p class="desc">${escapeHtml(r.descripcion || '')}</p>
        ${Array.isArray(r.ingredientesUsados) && r.ingredientesUsados.length ? `<div class="used-tags">${r.ingredientesUsados.map(i=>`<span>${escapeHtml(i)}</span>`).join('')}</div>` : ''}
        <ol class="steps">${(r.pasos||[]).map(p=>`<li>${escapeHtml(p)}</li>`).join('')}</ol>
      </div>`;
  }
  function wireRecipe() { document.getElementById('back-btn').onclick = () => { state.view='list'; state.recipe=null; render(); }; }

  function renderReviewScan() {
    return `
      <header class="top"><div class="titles"><h1>Despensa</h1></div></header>
      <div class="reviewScan">
        <button class="back" id="back-btn">&larr; cancelar</button>
        <h2>Esto he leído en el tique</h2>
        <p class="desc">Desmarca lo que no sea comida o lo que ya tengáis apuntado.</p>
        ${state.scanItems.length === 0 ? `<p class="desc">No he podido identificar ingredientes. Prueba con otra foto más clara.</p>` :
          state.scanItems.map((it,i)=>`<div class="check-row"><input type="checkbox" id="chk-${i}" ${it.checked?'checked':''} data-i="${i}"><label for="chk-${i}">${escapeHtml(it.name)}</label></div>`).join('')}
        ${state.scanItems.length > 0 ? `<button class="confirm-scan-btn" id="confirm-scan">Añadir a la despensa</button>` : ''}
      </div>`;
  }
  function wireReviewScan() {
    document.getElementById('back-btn').onclick = () => { state.view='list'; state.scanItems=[]; render(); };
    document.querySelectorAll('.check-row input').forEach(chk => chk.onchange = () => { state.scanItems[Number(chk.dataset.i)].checked = chk.checked; });
    const confirmBtn = document.getElementById('confirm-scan');
    if (confirmBtn) confirmBtn.onclick = confirmScan;
  }

  function renderShare() {
    return `
      <div class="overlay" id="share-overlay">
        <div class="share-card">
          <h2>Compartir con la familia</h2>
          <p>Que abran esto con la cámara del móvil y entrarán directos a la despensa. Sin cuentas, sin login.</p>
          <div id="qr-holder"></div>
          <div class="share-actions"><button id="copy-link">Copiar enlace</button></div>
          <button class="share-close" id="share-close">Cerrar</button>
        </div>
      </div>`;
  }
  function wireShare() {
    const holder = document.getElementById('qr-holder');
    holder.innerHTML = '';
    if (window.QRCode) new QRCode(holder, { text: window.location.href, width: 190, height: 190, colorDark: '#24352B', colorLight: '#ffffff' });
    document.getElementById('share-overlay').onclick = (e) => { if (e.target.id === 'share-overlay') closeShare(); };
    document.getElementById('share-close').onclick = closeShare;
    document.getElementById('copy-link').onclick = async () => {
      try {
        await navigator.clipboard.writeText(window.location.href);
        const btn = document.getElementById('copy-link');
        btn.textContent = 'Enlace copiado';
        setTimeout(() => { if (btn) btn.textContent = 'Copiar enlace'; }, 1800);
      } catch (e) {}
    };
  }
  function closeShare() { state.shareOpen = false; render(); }

  // Añadir y borrar son operaciones atómicas sobre un documento
  // suelto cada una — nunca reescriben la lista entera, así que dos
  // familiares pueden tocar la despensa a la vez sin pisarse.
  async function addItem() {
    const input = document.getElementById('new-item');
    const name = input.value.trim();
    if (!name) return;
    input.value = '';
    try {
      await addDoc(itemsCol, { name, addedAt: serverTimestamp() });
    } catch (e) {
      state.errorMsg = 'No se pudo guardar. Comprueba tu conexión.';
      render();
    }
  }
  async function removeItem(id) {
    state.pendingRemovals.add(id);
    render();
    try {
      await deleteDoc(doc(db, 'pantryItems', id));
    } catch (e) {
      state.errorMsg = 'No se pudo quitar. Inténtalo otra vez.';
    } finally {
      state.pendingRemovals.delete(id);
      render();
    }
  }

  async function suggestRecipe() {
    state.busy = 'recipe'; state.errorMsg = ''; render();
    try {
      const res = await fetch(WORKER_URL, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode: 'recipe', ingredients: state.items.map(i=>i.name), meal: MEALS[state.meal].promptWord })
      });
      if (!res.ok) throw new Error('worker_error');
      state.recipe = await res.json();
      state.view = 'recipe'; state.busy = null; render();
    } catch (e) {
      state.busy = null;
      state.errorMsg = 'No se me ocurrió nada esta vez. Comprueba tu conexión e inténtalo otra vez.';
      render();
    }
  }

  async function handlePhoto(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    state.busy = 'scan'; state.errorMsg = ''; render();
    try {
      const base64 = await fileToBase64(file);
      const res = await fetch(WORKER_URL, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode: 'scan', imageBase64: base64, mediaType: file.type })
      });
      if (!res.ok) throw new Error('worker_error');
      const names = await res.json();
      state.scanItems = (Array.isArray(names) ? names : []).filter(n => typeof n === 'string' && n.trim()).map(n => ({ name: n.trim(), checked: true }));
      state.busy = null; state.view = 'reviewScan'; render();
    } catch (err) {
      state.busy = null;
      state.errorMsg = 'No se pudo leer la foto. Prueba con otra o con más luz.';
      render();
    }
  }
  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function confirmScan() {
    const chosen = state.scanItems.filter(it => it.checked);
    state.scanItems = []; state.view = 'list'; render();
    await Promise.allSettled(chosen.map(it => addDoc(itemsCol, { name: it.name, addedAt: serverTimestamp() })));
  }

  render();
  onAuthStateChanged(auth, (user) => {
    if (!user) { signInAnonymously(auth).catch(err => console.error('Auth anónima falló', err)); return; }
    onSnapshot(itemsQuery, (snap) => {
      state.connected = true;
      state.items = snap.docs.map(d => ({ id: d.id, name: d.data().name }));
      if (state.view === 'list') render();
    }, (err) => {
      console.error('onSnapshot error', err);
      state.errorMsg = 'No se pudo conectar con la despensa compartida.';
      render();
    });
  });
</script>
</body>
</html>
